      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="pfAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#pfBg)"/>
  <circle cx="120" cy="100" r="200" fill="#a78bfa" opacity="0.12"/>
  <circle cx="690" cy="420" r="170" fill="#00d4ff" opacity="0.10"/>
  <!-- device -->
  <rect x="200" y="110" width="400" height="280" rx="16" fill="#140a2e" stroke="#3a2a6e" stroke-width="1.5"/>
  <circle cx="400" cy="128" r="4" fill="#3a2a6e"/>
  <!-- hero block -->
  <circle cx="290" cy="210" r="42" fill="url(#pfAccent)"/>
  <rect x="356" y="186" width="200" height="16" rx="8" fill="#3a2a6e"/>
  <rect x="356" y="212" width="160" height="12" rx="6" fill="#2c2052"/>
  <rect x="356" y="234" width="120" height="12" rx="6" fill="#2c2052"/>
  <!-- code lines -->
  <rect x="240" y="290" width="60" height="10" rx="5" fill="#a78bfa"/>
  <rect x="310" y="290" width="120" height="10" rx="5" fill="#2c2052"/>
  <rect x="240" y="312" width="100" height="10" rx="5" fill="#2c2052"/>
  <rect x="350" y="312" width="80" height="10" rx="5" fill="#00d4ff" opacity="0.6"/>
  <rect x="240" y="334" width="140" height="10" rx="5" fill="#2c2052"/>
  <!-- code tag -->
  <text x="520" y="350" font-family="Consolas, monospace" font-size="40" font-weight="700" fill="#a78bfa" opacity="0.55" text-anchor="middle">&lt;/&gt;</text>
  <text x="400" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f1e9ff" text-anchor="middle" letter-spacing="1">Personal Portfolio Website</text>
